# ============================================================
# FraudShield — Application Configuration
# ============================================================

# Server
server.port=8080
spring.application.name=fraudshield

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/fraudshield
spring.data.mongodb.database=fraudshield

# Logging
logging.level.com.fraudshield=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Jackson — consistent date serialisation
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/London

# Cortex AI — anomaly review (OpenAI-compatible API)
cortex.api.base-url=https://ew2-wrk-prd-wrk01-crs-cortex-api-175974228631.europe-west2.run.app/v1
# Paste your Cortex API key below. If CORTEX_API_KEY env var is set, it overrides this value.
cortex.api.key=${CORTEX_API_KEY:PASTE_YOUR_CORTEX_API_KEY_HERE}
cortex.api.model=gemini-2.5-flash
cortex.api.timeout-ms=30000
# Master switch for the Cortex AI call. Auto-disabled when no real API key is set;
# can also be toggled at runtime via POST /api/cortex/config.
cortex.api.enabled=true
