# ============================================================
# FraudShield — Application Configuration
# ============================================================

# Server
server.port=8080
spring.application.name=fraudshield

# MongoDB
spring.data.mongodb.uri=mongodb://localhost:27017/fraudshield
spring.data.mongodb.database=fraudshield

# Logging
logging.level.com.fraudshield=DEBUG
logging.level.org.springframework.data.mongodb=INFO

# Jackson — consistent date serialisation
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=Europe/London

# Cortex AI — anomaly review (OpenAI-compatible API)
cortex.api.base-url=https://ew2-wrk-prd-wrk01-crs-cortex-api-175974228631.europe-west2.run.app/v1
# Paste your Cortex API key below. If CORTEX_API_KEY env var is set, it overrides this value.
cortex.api.key=${CORTEX_API_KEY:PASTE_YOUR_CORTEX_API_KEY_HERE}
cortex.api.model=gemini-2.5-flash
cortex.api.timeout-ms=30000
# Master switch for the Cortex AI call. Auto-disabled when no real API key is set;
# can also be toggled at runtime via POST /api/cortex/config.
cortex.api.enabled=true

# Canton integration (disabled by default for local developer startup)
canton.enabled=${CANTON_ENABLED:false}
canton.global-synchronizer-party=${CANTON_GLOBAL_SYNCHRONIZER_PARTY:GlobalSynchronizer_Party}
canton.participants.banka.host=${CANTON_BANKA_HOST:localhost}
canton.participants.banka.ledger-port=${CANTON_BANKA_LEDGER_PORT:5001}
canton.participants.banka.admin-port=${CANTON_BANKA_ADMIN_PORT:5002}
canton.participants.banka.party=${CANTON_BANKA_PARTY:BankA_Party}
canton.participants.bankb.host=${CANTON_BANKB_HOST:localhost}
canton.participants.bankb.ledger-port=${CANTON_BANKB_LEDGER_PORT:5011}
canton.participants.bankb.admin-port=${CANTON_BANKB_ADMIN_PORT:5012}
canton.participants.bankb.party=${CANTON_BANKB_PARTY:BankB_Party}
canton.participants.bankc.host=${CANTON_BANKC_HOST:localhost}
canton.participants.bankc.ledger-port=${CANTON_BANKC_LEDGER_PORT:5021}
canton.participants.bankc.admin-port=${CANTON_BANKC_ADMIN_PORT:5022}
canton.participants.bankc.party=${CANTON_BANKC_PARTY:BankC_Party}
canton.participants.synchronizer.host=${CANTON_SYNCHRONIZER_HOST:localhost}
canton.participants.synchronizer.ledger-port=${CANTON_SYNCHRONIZER_LEDGER_PORT:5031}
canton.participants.synchronizer.admin-port=${CANTON_SYNCHRONIZER_ADMIN_PORT:5032}
canton.participants.synchronizer.party=${CANTON_SYNCHRONIZER_PARTY:GlobalSynchronizer_Party}
