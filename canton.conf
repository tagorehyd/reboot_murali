# Canton Configuration for FraudShield
# One synchronizer/domain with 3 bank participants plus one GlobalSynchronizer participant.
# FraudShield keeps MongoDB as its only application projection store; Canton participant
# storage remains the authoritative ledger storage for shared bank workflow contracts.

canton {
  monitoring {
    logging {
      level = INFO
    }
  }

  features {
    enable-preview-commands = true
    enable-testing-time-service = true
  }

  synchronizers {
    fraudshield-domain {
      type = Community
      storage {
        type = sqlite
        data-dir = ${?CANTON_DATA_DIR}"/domain"
      }
      public-api { port = 4011 }
      admin-api { port = 4012 }
      monitoring { metrics { enabled = true, port = 4013 } }
    }
  }

  participants {
    banka {
      type = Community
      storage { type = sqlite, data-dir = ${?CANTON_DATA_DIR}"/banka" }
      ledger-api { port = 5001, max-inbound-message-size = 4194304 }
      admin-api { port = 5002 }
      monitoring { metrics { enabled = true, port = 5003 } }
    }

    bankb {
      type = Community
      storage { type = sqlite, data-dir = ${?CANTON_DATA_DIR}"/bankb" }
      ledger-api { port = 5011, max-inbound-message-size = 4194304 }
      admin-api { port = 5012 }
      monitoring { metrics { enabled = true, port = 5013 } }
    }

    bankc {
      type = Community
      storage { type = sqlite, data-dir = ${?CANTON_DATA_DIR}"/bankc" }
      ledger-api { port = 5021, max-inbound-message-size = 4194304 }
      admin-api { port = 5022 }
      monitoring { metrics { enabled = true, port = 5023 } }
    }

    synchronizer {
      type = Community
      storage { type = sqlite, data-dir = ${?CANTON_DATA_DIR}"/synchronizer" }
      ledger-api { port = 5031, max-inbound-message-size = 4194304 }
      admin-api { port = 5032 }
      monitoring { metrics { enabled = true, port = 5033 } }
    }
  }
}
