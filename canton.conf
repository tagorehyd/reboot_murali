# Canton Configuration for FraudShield
# Single domain with 3 bank participants + 1 synchronizer
# See: https://docs.daml.com/canton/usermanual/local_deployment.html

canton {
  # Global settings
  monitoring {
    logging {
      level = INFO
    }
  }

  features {
    # Enable required features for multi-party workflows
    enable-preview-commands = true
    enable-testing-time-service = true
  }

  # Single synchronizer/domain
  synchronizers {
    fraudshield-domain {
      type = Community
      
      storage {
        type = sqlite
        data-dir = ${?CANTON_DATA_DIR}"/domain"
      }

      public-api {
        port = 4011
      }

      admin-api {
        port = 4012
      }

      # Metrics and health
      monitoring {
        metrics {
          enabled = true
          port = 4013
        }
      }
    }
  }

  # BankA Participant
  participants {
    banka {
      type = Community
      
      storage {
        type = sqlite
        data-dir = ${?CANTON_DATA_DIR}"/banka"
      }

      ledger-api {
        port = 5001
        max-inbound-message-size = 4194304
      }

      admin-api {
        port = 5002
      }

      monitoring {
        metrics {
          enabled = true
          port = 5003
        }
      }
    }
  }

  # BankB Participant
  participants {
    bankb {
      type = Community
      
      storage {
        type = sqlite
        data-dir = ${?CANTON_DATA_DIR}"/bankb"
      }

      ledger-api {
        port = 5011
        max-inbound-message-size = 4194304
      }

      admin-api {
        port = 5012
      }

      monitoring {
        metrics {
          enabled = true
          port = 5013
        }
      }
    }
  }

  # BankC Participant
  participants {
    bankc {
      type = Community
      
      storage {
        type = sqlite
        data-dir = ${?CANTON_DATA_DIR}"/bankc"
      }

      ledger-api {
        port = 5021
        max-inbound-message-size = 4194304
      }

      admin-api {
        port = 5022
      }

      monitoring {
        metrics {
          enabled = true
          port = 5023
        }
      }
    }
  }

  # Synchronizer Participant (Global Synchronizer)
  participants {
    synchronizer {
      type = Community
      
      storage {
        type = sqlite
        data-dir = ${?CANTON_DATA_DIR}"/synchronizer"
      }

      ledger-api {
        port = 5031
        max-inbound-message-size = 4194304
      }

      admin-api {
        port = 5032
      }

      monitoring {
        metrics {
          enabled = true
          port = 5033
        }
      }
    }
  }
}
