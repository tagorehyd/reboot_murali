# Canton Configuration for FraudShield
# Compatible with Canton Community 3.x-style config keys.
#
# This local/dev topology runs one synchronizer plus four in-memory participants:
# BankA, BankB, BankC, and GlobalSynchronizer. FraudShield still uses MongoDB
# as the only application projection/read-model database; Canton participant
# storage is the authoritative ledger state for shared workflow contracts.

canton {
  synchronizers {
    fraudshield-domain {
      type = community
      storage.type = memory
      public-api.address = "0.0.0.0"
      public-api.port = 4011
      admin-api.address = "0.0.0.0"
      admin-api.port = 4012
    }
  }

  participants {
    banka {
      type = community
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5001
      admin-api.address = "0.0.0.0"
      admin-api.port = 5002
    }

    bankb {
      type = community
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5011
      admin-api.address = "0.0.0.0"
      admin-api.port = 5012
    }

    bankc {
      type = community
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5021
      admin-api.address = "0.0.0.0"
      admin-api.port = 5022
    }

    synchronizer {
      type = community
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5031
      admin-api.address = "0.0.0.0"
      admin-api.port = 5032
    }
  }
}
