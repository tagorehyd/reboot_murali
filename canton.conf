# Canton Configuration for FraudShield
# Compatible with Canton Community images that still use the "domains" config key.
#
# Local/dev topology: one domain plus four in-memory participants: BankA,
# BankB, BankC, and GlobalSynchronizer. MongoDB remains the only FraudShield
# application projection/read-model database.

canton {
  domains {
    fraudshield-domain {
      storage.type = memory
      public-api.address = "0.0.0.0"
      public-api.port = 4011
      admin-api.address = "0.0.0.0"
      admin-api.port = 4012
    }
  }

  participants {
    banka {
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5001
      admin-api.address = "0.0.0.0"
      admin-api.port = 5002
    }

    bankb {
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5011
      admin-api.address = "0.0.0.0"
      admin-api.port = 5012
    }

    bankc {
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5021
      admin-api.address = "0.0.0.0"
      admin-api.port = 5022
    }

    synchronizer {
      storage.type = memory
      ledger-api.address = "0.0.0.0"
      ledger-api.port = 5031
      admin-api.address = "0.0.0.0"
      admin-api.port = 5032
    }
  }
}
