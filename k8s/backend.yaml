apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-backend
  namespace: fraudshield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraudshield-backend
  template:
    metadata:
      labels:
        app: fraudshield-backend
    spec:
      containers:
        - name: backend
          image: REGION-docker.pkg.dev/PROJECT_ID/fraudshield/fraudshield-backend:TAG
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://$(MONGO_USERNAME):$(MONGO_PASSWORD)@mongodb-0.mongodb:27017/fraudshield?authSource=admin
            - name: MONGO_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mongo-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
            - name: APP_CORS_ALLOWED_ORIGIN_PATTERNS
              value: "*"
            - name: CORTEX_API_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: CORTEX_API_KEY
          readinessProbe:
            httpGet:
              path: /ready
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-backend
  namespace: fraudshield
spec:
  type: ClusterIP
  selector:
    app: fraudshield-backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
