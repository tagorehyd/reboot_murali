apiVersion: apps/v1
kind: Deployment
metadata:
  name: fraudshield-frontend
  namespace: fraudshield
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fraudshield-frontend
  template:
    metadata:
      labels:
        app: fraudshield-frontend
    spec:
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/fraudshield/fraudshield-frontend:TAG
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fraudshield-frontend
  namespace: fraudshield
spec:
  type: LoadBalancer
  selector:
    app: fraudshield-frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
