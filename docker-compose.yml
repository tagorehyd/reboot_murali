+      - ./:/workspace:ro
+      - daml-dist:/workspace/daml-dist
+    command: ["bash", "-lc", "rm -rf /tmp/daml-contracts; cp -R /workspace/daml-contracts /tmp/daml-contracts; cd /tmp/daml-contracts; daml build; mkdir -p /workspace/daml-dist; cp .daml/dist/*.dar /workspace/daml-dist/"]
     depends_on:
       canton:
         condition: service_started
 
   daml-upload:
