version: "3.8"

services:
  mongodb:
    image: mongo:6.0
    container_name: fraudshield-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: fraudshield
      MONGO_INITDB_ROOT_PASSWORD: fraudshield-local-password
      MONGO_INITDB_DATABASE: fraudshield
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-service:
    build:
      context: ./ml-service
    image: fraudshield-ml-service:local
    container_name: fraudshield-ml-service
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      SPRING_DATA_MONGODB_URI: mongodb://fraudshield:fraudshield-local-password@mongodb:27017/fraudshield?authSource=admin
    depends_on:
      mongodb:
        condition: service_healthy

  fraudshield-backend:
    build:
      context: ./Backend
    image: fraudshield-backend:local
    container_name: fraudshield-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://fraudshield:fraudshield-local-password@mongodb:27017/fraudshield?authSource=admin
      SPRING_DATA_MONGODB_DATABASE: fraudshield
      ISOLATION_FOREST_BASE_URL: http://ml-service:5001
      ISOLATION_FOREST_ENABLED: "true"
      CANTON_ENABLED: "false"
    ports:
      - "8080:8080"

  fraudshield-frontend:
    build:
      context: ./FrontEnd
    image: fraudshield-frontend:local
    container_name: fraudshield-frontend
    restart: unless-stopped
    depends_on:
      - fraudshield-backend
    ports:
      - "5173:80"

volumes:
  mongo-data:
